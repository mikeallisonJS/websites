name: Code quality

on: [pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run Oxlint and Oxfmt
        run: vp check
