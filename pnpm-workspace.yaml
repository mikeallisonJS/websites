packages:
  - 'apps/*'
  - 'packages/*'

# The root package holds the framework dependencies (next, react, sentry, ...)
# that every app shares, so apps resolve them from the hoisted root store the
# same way they did under bun's flat node_modules.
nodeLinker: hoisted

# Ported from the bun `trustedDependencies` field: packages allowed to run
# install lifecycle scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  sharp: true
  utf-8-validate: true
