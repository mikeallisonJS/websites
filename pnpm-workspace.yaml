packages:
  - 'apps/*'
  - 'packages/*'

# Ported from the bun `trustedDependencies` field: packages allowed to run
# install lifecycle scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  sharp: true
  utf-8-validate: true

# GHSA-mrhx-c7xc-m3w5: zod reached through vercel, fixed in 4.6.6.
overrides:
  'zod@3.22.4': 4.6.7
  'zod@4.1.11': 4.6.7
