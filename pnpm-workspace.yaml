packages:
  - 'apps/*'
  - 'packages/*'

# Ported from the bun `trustedDependencies` field: packages allowed to run
# install lifecycle scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  sharp: true
  utf-8-validate: true

# GHSA-x8mw-p69m-v3mx: no vercel release pulls a fixed @fastify/busboy.
# GHSA-9wv6-86v2-598j, GHSA-j3q9-mxjg-w52f: path-to-regexp via vercel.
overrides:
  '@fastify/busboy': 3.2.1
  'brace-expansion@1': 1.1.20
  path-to-regexp@6.1.0: 6.3.0
  path-to-regexp@8.3.0: 8.4.0
  'minimatch@10.1.1': 10.2.3
  js-yaml@4.1.1: 4.3.2
