packages:
  - 'apps/*'
  - 'packages/*'

# Ported from the bun `trustedDependencies` field: packages allowed to run
# install lifecycle scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  sharp: true
  utf-8-validate: true

# GHSA-mrhx-c7xc-m3w5: zod reached through vercel, fixed in 4.6.6.
# GHSA-x8mw-p69m-v3mx: no vercel release pulls a fixed @fastify/busboy.
# @vercel/container pins tar exactly at 7.5.11, which has known advisories.
# GHSA-9wv6-86v2-598j, GHSA-j3q9-mxjg-w52f: path-to-regexp via vercel.
overrides:
  '@fastify/busboy': 3.2.1
  'zod@3.22.4': 4.6.7
  'zod@4.1.11': 4.6.7
  'undici@>=5 <7': 6.29.1
  'undici@>=7 <8': 7.30.1
  smol-toml: 1.7.1
  path-to-regexp@6.1.0: 6.3.0
  path-to-regexp@8.3.0: 8.4.0
  'minimatch@10.1.1': 10.2.3
  js-yaml@4.1.1: 4.3.2
  '@vercel/container>tar': 7.5.21
